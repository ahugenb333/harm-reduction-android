// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Defines repositories and dependencies for build scripts themselves.
buildscript {
    repositories {
        google()        // Google's Maven repository
        mavenCentral()  // Main Maven repository
    }
    dependencies {
        // Provides Hilt Gradle plugin for code generation and DI setup.
        // Version should align with Hilt library dependencies in module-level build files.
        classpath "com.google.dagger:hilt-android-gradle-plugin:2.48"
    }
}

// Defines plugins applied to the project. `apply false` means the plugin is made available to sub-projects
// but not applied to the root project itself. Sub-projects must explicitly apply them.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.compose) apply false
    // Note: google-gms-services and firebase-crashlytics plugins are applied in module-level build.gradle files,
    // their versions are managed in the libs.versions.toml file.
}