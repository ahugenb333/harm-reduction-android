# This is a Gradle version catalog file.
# For more information, see https://docs.gradle.org/current/userguide/version_catalog_basics.html

[versions]
# Project-level build.gradle versions
# composeUi = "1.7.8" -> Renamed to compose for broader use (ui, material, etc.)
compose = "1.7.8"
navigation = "2.8.8" # Renamed from nav
room = "2.5.1"
wearCompose = "1.1.2" # Used for wear.compose.material and wear.compose.foundation
googleServicesPlugin = "4.3.15" # Renamed from googleServices for clarity (it's a plugin)
firebaseCrashlyticsPlugin = "2.9.4" # Renamed from firebaseCrashlyticsGradle for clarity
androidGradlePlugin = "8.8.2"
kotlin = "2.1.10" # Renamed from kotlinAndroid & kotlinCompose as they are the same

# App module versions
hilt = "2.48" # Added for Hilt
kotlinxCoroutinesTest = "1.8.0" # Added for runTest
coreKtx = "1.15.0" # Used by both app and wear modules
lifecycleRuntimeKtx = "2.8.7" # Used by both app and wear modules
activityCompose = "1.10.1" # Used by both app and wear modules
playServicesWearable = "18.0.0" # Used in app and wear
jodaTime = "2.12.1.1" # Renamed from androidJoda; Used in app and wear
accompanistSystemUiController = "0.30.0"
firebaseAnalytics = "21.2.1"
firebaseBom = "31.4.0"
junit = "4.13.2"
androidxTestExtJunit = "1.1.5"
androidxTestEspressoCore = "3.5.1"

# HRA Wear module versions
percentLayout = "1.0.0"
legacySupportV4 = "1.0.0"
recyclerView = "1.3.0"
composeMaterialWear = "1.4.0"

[libraries]
# Hilt
hilt-android-lib = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# Buildscript/Plugin Classpath Dependencies (from project build.gradle) - these are applied as plugins now
# googleServicesPlugin = { group = "com.google.gms", name = "google-services", version.ref = "googleServicesPlugin" }
# firebaseCrashlyticsPlugin = { group = "com.google.firebase", name = "firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsPlugin" }

# App module dependencies (some also used by HRA Wear module)
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" } # Shared: app, wear
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" } # Shared: app, wear
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" } # Shared: app, wear
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" } # Shared: app, wear
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" } # Shared: app, wear
androidx-compose-material = { group = "androidx.compose.material", name = "material", version.ref = "compose" } # Shared: app, wear
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" } # Shared: app, wear
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
google-play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" } # Used in app and wear
joda-time = { group = "net.danlew", name = "android.joda", version.ref = "jodaTime" } # Used in app and wear
google-accompanist-systemuicontroller = { group = "com.google.accompanist", name = "accompanist-systemuicontroller", version.ref = "accompanistSystemUiController" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics", version.ref = "firebaseAnalytics" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics-ktx = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" } # Version from BOM
firebase-analytics-ktx = { group = "com.google.firebase", name = "firebase-analytics-ktx" } # Version from BOM

# Test dependencies (app)
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" } # Added for Kotlin specific tests
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" } # Added for runTest
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspressoCore" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" } # Shared: app, wear
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" } # Shared: app, wear
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" } # Shared: app, wear

# HRA Wear module dependencies (specific to Wear)
androidx-percentlayout = { group = "androidx.percentlayout", name = "percentlayout", version.ref = "percentLayout" }
androidx-legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacySupportV4" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerView" }
androidx-compose-material-wear = { group = "androidx.compose.material", name = "material", version.ref = "composeMaterialWear" } # Specific material version for wear
androidx-wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }


[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Kapt version is tied to Kotlin plugin version, so no explicit version.ref needed here
kotlin-kapt = { id = "kotlin-kapt" } # Kapt version is tied to Kotlin plugin version
google-gms-services = { id = "com.google.gms.google-services", version.ref = "googleServicesPlugin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
hilt-android-gradle = { id = "com.google.dagger.hilt.android.gradle", version.ref = "hilt" } # Hilt Gradle Plugin
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" } # Hilt Android Plugin for module
