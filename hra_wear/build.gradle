plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose) // Added kotlin.compose for composeFeatures
}

android {
    namespace 'com.ahugenb.hra.wear'
    compileSdk 35

    defaultConfig {
        // TODO: CRITICAL! Verify and update this applicationId to match the one listed in your Google Play Console for the released wearable app. This placeholder ("com.ahugenb.hra.wear") MUST be corrected if it doesn't match your actual released package name to ensure app updates work correctly.
        applicationId "com.ahugenb.hra.wear"
        minSdk 30
        targetSdk 35
        versionCode 15
        versionName "2.1.6"
        vectorDrawables {
            useSupportLibrary true
        }

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    // composeOptions {
    //     kotlinCompilerExtensionVersion is now managed by the Kotlin Compose plugin
    // }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation libs.kotlin.stdlib.jdk8 // Explicitly include Kotlin standard library for version consistency.
    implementation libs.androidx.core.ktx
    implementation libs.google.play.services.wearable
    implementation libs.androidx.percentlayout
    implementation libs.androidx.legacy.support.v4
    implementation libs.androidx.recyclerview

    //compose
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material.wear // Specific version for wear

    //joda-time
    implementation libs.joda.time

    implementation libs.androidx.wear.compose.material
    implementation libs.androidx.wear.compose.foundation
    implementation libs.androidx.lifecycle.runtime.ktx
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}