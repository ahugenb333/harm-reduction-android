plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose) // Added kotlin.compose for composeFeatures
}

android {
    // TODO: Consider a unique namespace for the wear module (e.g., com.ahugenb.hra.wear) if it's a distinct application.
    namespace 'com.ahugenb.hra'
    compileSdk 35

    defaultConfig {
        // TODO: Consider a unique applicationId for the wear module if it's a distinct application.
        applicationId "com.ahugenb.hra"
        minSdk 30
        targetSdk 35
        versionCode 15
        versionName "2.1.6"
        vectorDrawables {
            useSupportLibrary true
        }

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    // composeOptions {
    //     kotlinCompilerExtensionVersion is now managed by the Kotlin Compose plugin
    // }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.google.play.services.wearable
    implementation libs.androidx.percentlayout
    implementation libs.androidx.legacy.support.v4
    implementation libs.androidx.recyclerview

    //compose
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material.wear // Specific version for wear

    //joda-time
    implementation libs.joda.time

    implementation libs.androidx.wear.compose.material
    implementation libs.androidx.wear.compose.foundation
    implementation libs.androidx.lifecycle.runtime.ktx
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}