plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.kapt)
    alias(libs.plugins.google.gms.services)
    alias(libs.plugins.firebase.crashlytics)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.hilt.android) // Corrected: apply true is default
}

android {
    namespace 'com.ahugenb.hra'
    compileSdk 35

    defaultConfig {
        applicationId "com.ahugenb.hra"
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName "2.1.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    // composeOptions {
    //     kotlinCompilerExtensionVersion is now managed by the Kotlin Compose plugin
    // }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx

    //compose
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.navigation.compose

    //room
    implementation libs.androidx.room.runtime
    implementation libs.google.play.services.wearable // This was play-services-wearable, ensure alias matches
    kapt libs.androidx.room.compiler
    implementation libs.androidx.room.ktx

    //joda-time
    implementation libs.joda.time

    //change system UI bar programmatically
    implementation libs.google.accompanist.systemuicontroller

    //firebase
    implementation libs.firebase.analytics
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.crashlytics.ktx
    implementation libs.firebase.analytics.ktx

    testImplementation libs.junit
    testImplementation libs.kotlin.test.junit // Added for Kotlin specific tests
    testImplementation libs.kotlinx.coroutines.test // Added for runTest

    // Hilt
    implementation libs.hilt.android.lib
    kapt libs.hilt.compiler

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

}